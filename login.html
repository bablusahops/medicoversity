<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Medicoversity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-slate-100">
    <!-- Header / Logo -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center gap-2">
        <img src="logo.png" alt="Medicoversity Logo" class="h-10 w-auto object-contain" />
        <span class="text-2xl font-extrabold text-[#0B2545]">MEDICOVERSITY</span>
      </a>
      
      <p class="text-sm text-gray-500">Sign in to access your medical courses</p>
    </div>

    <!-- Login Form -->
    <form action="#" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" required placeholder="doctor@example.com" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#00875A] focus:border-transparent outline-none transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#00875A] focus:border-transparent outline-none transition" />
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center text-gray-600">
          <input type="checkbox" class="rounded border-gray-300 text-[#00875A] focus:ring-[#00875A] mr-2" />
          Remember me
        </label>
        <a href="#" class="text-[#00875A] font-semibold hover:underline">Forgot password?</a>
      </div>

      <button type="submit" class="w-full py-3 bg-[#00875A] hover:bg-[#00704A] text-white font-semibold rounded-lg shadow-md transition duration-200">
        Sign In
      </button>
    </form>

    <!-- Back to Home -->
    <div class="text-center text-sm text-gray-500 pt-2">
      <a href="index.html" class="inline-flex items-center gap-1 text-[#00875A] hover:underline font-medium">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
